<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMM 量測功能快速選擇工具</title><style> *{box-sizing:border-box}body{margin:0;padding:20px;background:#f5f7fa;color:#182a3a;font:16px system-ui,sans-serif}main{max-width:740px;margin:auto;background:white;padding:24px;border:1px solid #dce3eb;border-radius:14px}h1{font-size:24px;margin:0 0 20px}label,small{color:#526579}select,button{font:inherit;padding:12px;border:1px solid #bac9d7;border-radius:7px;background:white;color:#182a3a;width:100%;margin:8px 0}button{cursor:pointer;background:#eaf1f7} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.panel{background:#f1f5f9;padding:14px;border-radius:8px}strong{display:block;font-size:22px;margin:6px 0}svg{width:100%;max-height:320px;display:block}p{line-height:1.65} .red{color:#b91c1c}.warn{border-top:1px solid #dce3eb;padding-top:12px;font-size:13px;color:#744018}@media(max-width:420px){body{padding:6px}main{padding:14px}.grid{grid-template-columns:1fr}h1{font-size:20px}}</style><main><small>PCB / DUT / BURN-IN · DMM REFERENCE</small><h1>量測功能快速選擇工具</h1><label for="choice">選擇檢測項目</label><select id="choice"></select><div class="grid"><div class="panel"><small>電表 Function</small><strong id="func"></strong><span id="eng"></span></div><div class="panel"><small>電路狀態</small><strong id="power"></strong><span id="jack"></span></div></div><svg id="diagram" viewBox="0 0 360 250" role="img" aria-label="量測接線示意"></svg><p><b class="red">紅色表筆：</b><span id="red"></span><br><b>黑色表筆：</b><span id="black"></span></p><h3>判斷方式</h3><p id="result"></p><button id="copy">複製目前量測方法</button><small id="status" aria-live="polite"></small><p class="warn">適用於一般低壓 PCB。電阻、導通、二極體及電容檔須斷電並確認放電；電流檔須先斷電接線，禁止直接跨接電源。實際規格依電表及元件 Datasheet。</p></main><script>const rows=[["PCB供電", "V⎓", "DC Voltage", "通電", "VΩ", "Power Rail", "GND", "符合額定電壓"], ["電源對地短路", "Ω", "Resistance", "斷電並放電", "VΩ", "Power Rail", "GND", "與正常板比較；低阻值不一定是短路。"], ["電阻", "Ω", "Resistance", "斷電", "VΩ", "一端", "另一端", "符合額定阻值及誤差；板上並聯路徑可能影響讀值。"], ["保險絲", "導通檔", "Continuity", "斷電", "VΩ", "一端", "另一端", "接近0Ω"], ["Cable與Connector", "導通檔", "Continuity", "斷電並隔離", "VΩ", "起始Pin", "對應Pin", "對應接點導通"], ["二極體", "二極體檔", "Diode Test", "斷電", "VΩ", "Anode", "Cathode", "一般矽二極體正向0.5～0.8V反向OL"], ["電容", "電容檔", "Capacitance", "斷電並放電", "依電表規格", "依極性接線", "依極性接線", "符合容量規格；必要時解焊，普通電表不能完整檢查 ESR。"], ["電感", "Ω", "Resistance", "斷電", "VΩ", "一端", "另一端", "符合DCR規格"], ["MOSFET", "二極體檔及Ω", "Diode Test", "斷電並隔離", "VΩ", "Source (S)", "Drain (D)", "一般 N-MOSFET：先將 G-S 放電，再測 Body Diode 正反向與 Gate 絕緣；P-MOSFET 方向相反。依 Datasheet 確認腳位。"], ["DUT電流", "A⎓", "DC Current", "斷電接線後通電", "A或mA", "電源側", "負載側", "串聯量測並符合電流規格；不可直接跨接電源正負極。"], ["Shunt壓降", "DC mV", "DC Millivolt", "通電", "VΩ", "高電位端", "低電位端", "I=V/R"], ["電源波動", "V⎓ + MIN/MAX", "Voltage Recording", "通電", "VΩ", "Power Rail", "GND", "最大最小值符合規格；快速瞬態需示波器。"], ["PWM訊號", "Hz / %", "Frequency / Duty Cycle", "通電", "依電表規格", "PWM Signal", "Signal GND", "符合頻率與占空比規格"]];const $=id=>document.getElementById(id);rows.forEach((r,i)=>$('choice').add(new Option(r[0],i)));function draw(){const r=rows[+$('choice').value];['func','eng','power','jack','red','black','result'].forEach((id,i)=>$(id).textContent=i===3?'COM + '+r[i+1]:r[i+1]);const current=r[0]==='DUT電流';let shape=r[0]==='二極體'||r[0]==='MOSFET'?'<path d="M180 179 L154 165 V193 Z M154 164 V194 M100 179 H154 M180 179 H260"/>':r[0]==='電容'?'<path d="M100 179 H172 M172 163 V195 M188 163 V195 M188 179 H260"/>':'<path d="M100 179 H145 M215 179 H260"/><rect x="145" y="166" width="70" height="26" rx="3"/>';if(r[0]==='PCB供電'||r[0]==='電源波動'||r[0]==='PWM訊號'||r[0]==='電源對地短路')shape='<path d="M100 179 H145 M215 179 H260"/><rect x="145" y="166" width="70" height="26" rx="3"/><text x="180" y="183" text-anchor="middle" stroke="none" fill="#182a3a" font-size="11">PCB / DUT</text>';if(r[0]==='電感')shape='<path d="M100 179 H145 q8 -25 16 0 q8 -25 16 0 q8 -25 16 0 q8 -25 16 0 H260"/>';if(r[0]==='Cable與Connector'||r[0]==='保險絲')shape='<path d="M100 179 H260"/>';let meter=`<rect x="116" y="8" width="128" height="108" rx="10" fill="#d5a632"/><rect x="124" y="16" width="112" height="92" rx="5" fill="#34414d"/><rect x="133" y="24" width="94" height="28" rx="3" fill="#dce9cf"/><text x="180" y="42" font-size="12" text-anchor="middle" fill="#182a3a">${r[1]}</text><circle cx="180" cy="72" r="14" fill="#82909b"/><path d="M180 72 L189 62" stroke="white" stroke-width="3"/><text x="149" y="96" font-size="9" fill="white" text-anchor="middle">COM</text><text x="211" y="96" font-size="9" fill="white" text-anchor="middle">${current?'A/mA':'VΩ*'}</text><circle cx="149" cy="104" r="4" fill="#111"/><circle cx="211" cy="104" r="4" fill="#dc2626"/>`;let circuit=current?`<g fill="none" stroke-width="2.5"><path d="M211 104 C300 110 300 150 280 165 H60 V205 H150" stroke="#c62828"/><path d="M149 104 C80 110 85 150 120 165 H155" stroke="#555"/><rect x="155" y="153" width="60" height="24" stroke="#526579"/><path d="M215 165 H300 V205 H182 M150 193 V217 M160 198 V212 M172 193 V217 M182 198 V212" stroke="#526579"/></g><text x="185" y="169" font-size="11" text-anchor="middle">DUT</text><text x="180" y="240" text-anchor="middle" font-size="13">串聯量測（先斷電接線）</text>`:`<path d="M149 104 C50 110 65 150 100 179" stroke="#555" stroke-width="2.5" fill="none"/><path d="M211 104 C310 110 295 150 260 179" stroke="#c62828" stroke-width="2.5" fill="none"/><rect x="45" y="153" width="270" height="76" rx="7" fill="#e8f1ed" stroke="#9ab8a8"/><g stroke="#526579" stroke-width="2" fill="none">${shape}</g><circle cx="100" cy="179" r="5" fill="#555"/><circle cx="260" cy="179" r="5" fill="#c62828"/><text x="100" y="211" font-size="11" text-anchor="middle">${r[6]}</text><text x="260" y="211" font-size="11" text-anchor="middle" fill="#b91c1c">${r[5]}</text><text x="180" y="246" text-anchor="middle" font-size="10">接點示意；* 插孔依電表規格</text>`;$('diagram').innerHTML=meter+circuit;$('status').textContent='';} $('choice').onchange=draw;$('copy').onclick=async()=>{let t=rows[+$('choice').value].map((v,i)=>['檢測項目','Function','英文名稱','電路狀態','紅筆插孔','紅色表筆','黑色表筆','判斷方式'][i]+'：'+v).join('\n');try{await navigator.clipboard.writeText(t);$('status').textContent='已複製';}catch{let a=document.createElement('textarea');a.value=t;document.querySelector('main').append(a);a.select();$('status').textContent='請手動複製下方文字';}};draw();</script></html>
